services:
  - type: web
    name: cheonsang-rpg-api
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: 최연욱
      - key: ADMIN_PASSWORD
        sync: false
